name: Deploy to GitHub Pages

# main への push で dist をビルドし、gh-pages ブランチへ push する（ブランチ配信方式）。
# 以前の actions/deploy-pages 方式は Pages デプロイ行列の詰まりで
# タイムアウト多発したため、こちらに切り替えた。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
